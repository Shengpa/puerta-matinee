<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Puerta Matinée</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#003087">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Puerta">
<style>
:root{
  /* colores del Liceo: azul de Tiburones y el Kiosko + celeste del escudo */
  --azul:#003087; --azul2:#0047CC; --azulclaro:#e8f0ff;
  --celeste:#33A3DC; --celeste2:#6cc4f0;
  --bg:#f4f7ff; --card:#fff; --line:#c5d4ed;
  --txt:#0a1628; --txt2:#334155; --mut:#64748b;
  --verde:#16a34a; --verdeclaro:#e7f7ed; --verdeline:#9ad8b0; --rojo:#dc2626;
  --naranja:#ea580c; --naranjaclaro:#fff1e8; --naranjaline:#f7c4a3;
  --acento:#003087; --hdr:#003087; --alertbg:#fdecec; --alerttxt:#7f1d1d; --oktxt:#14532d;
  --r:16px;
  color-scheme:light;
}
/* modo oscuro: para la puerta de noche */
:root[data-theme="dark"]{
  --bg:#0b1220; --card:#141d31; --line:#26324a;
  --txt:#e8eefc; --txt2:#c3cde2; --mut:#8b98b3;
  --azulclaro:#1b2a4a; --verdeclaro:#0f2e1d; --verdeline:#1f6b45;
  --naranjaclaro:#3a1d0c; --naranjaline:#8a3d12;
  --acento:#8fd0f5; --hdr:#0a1a45; --alertbg:#3a0f16; --alerttxt:#ffd6de; --oktxt:#b9f2cf;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
input,select{font:inherit}
.hidden{display:none!important}

/* encabezado azul */
header{position:sticky;top:0;z-index:5;background:var(--hdr);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;border-radius:0 0 20px 20px;box-shadow:0 6px 18px rgba(0,48,135,.25)}
.hrow{display:flex;align-items:center;gap:10px}
.title{flex:1;min-width:0}
.title b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title small{color:#c9d7f5;font-size:12px}
.dot{display:inline-block;vertical-align:0;width:9px;height:9px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80;flex:none}
.dot.off{background:#ff6b6b;box-shadow:0 0 8px #ff6b6b}
.dot.sync{background:var(--celeste2);box-shadow:0 0 8px var(--celeste2)}
.iconbtn{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:20px;flex:none}

.stats{margin-top:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:var(--r);padding:10px 14px}
.stats .big{display:flex;align-items:baseline;gap:8px}
.stats .big b{font-size:34px;color:var(--celeste);font-variant-numeric:tabular-nums}
.stats .big span{color:#dbe5fb}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.15);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--celeste);transition:width .4s}
.stats .sub{display:flex;justify-content:space-between;gap:8px;color:#c9d7f5;font-size:13px;margin-top:6px}

.search{margin-top:10px;position:relative}
.search input{width:100%;height:52px;border-radius:14px;border:2px solid transparent;background:var(--card);color:var(--txt);padding:0 44px 0 16px;font-size:18px;outline:none}
.search input:focus{border-color:var(--celeste)}
.search button{position:absolute;right:6px;top:6px;width:40px;height:40px;border-radius:10px;background:transparent;color:var(--mut);font-size:20px}
.tabs{display:flex;gap:6px;margin-top:10px}
.tabs button{flex:1;min-width:0;height:38px;border-radius:10px;background:rgba(255,255,255,.12);color:#dbe5fb;font-size:13px;font-weight:600;white-space:nowrap;padding:0 4px}
.tabs button.on{background:var(--celeste);color:var(--azul)}

/* lista */
main{padding:6px 16px 110px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;width:100%;text-align:left;color:var(--txt)}
.row .n{flex:1;min-width:0}
.row .n b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .n small{color:var(--mut);font-size:13px}
.pill{flex:none;font-size:12px;font-weight:700;padding:6px 10px;border-radius:20px;background:var(--azulclaro);color:var(--acento)}
.row.in{border-color:var(--verdeline);background:var(--verdeclaro)}
.row.in .pill{background:var(--verde);color:#fff}
.row.out{border-color:var(--naranjaline);background:var(--naranjaclaro)}
.row.out .pill{background:var(--naranja);color:#fff}
.row.flash{animation:flash 1.2s}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--celeste)}100%{box-shadow:0 0 0 0 transparent}}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--celeste);color:var(--azul);margin-left:6px;vertical-align:2px}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
.more{display:block;margin:14px auto;background:var(--card);border:1px solid var(--line);padding:10px 18px;border-radius:12px;color:var(--acento)}

.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));height:56px;padding:0 20px;border-radius:28px;background:var(--celeste);color:var(--azul);font-weight:800;font-size:16px;box-shadow:0 8px 22px rgba(0,48,135,.3);z-index:6}

/* paneles */
.veil{position:fixed;inset:0;background:rgba(10,22,40,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--card);border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto;border-top:5px solid var(--celeste)}
.sheet h2{margin:0 0 4px;font-size:24px;color:var(--acento)}
.sheet .meta{color:var(--mut);margin-bottom:16px}
.btn{display:block;width:100%;height:56px;border-radius:14px;font-weight:800;font-size:18px;margin-top:10px;background:var(--azulclaro);color:var(--acento);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.btn.go{background:var(--verde);color:#fff;border:0;height:72px;font-size:22px}
.btn.or{background:var(--azul);color:#fff;border:0}
.btn.warn{background:var(--card);color:var(--rojo);border:1px solid var(--rojo)}
.btn.exit{background:var(--naranja);color:#fff;border:0;height:64px;font-size:20px}
.btn.ghost{background:transparent;border:0;color:var(--mut);font-weight:600;height:46px}
.btn.sm{height:46px;font-size:16px}
.inbox{background:var(--verdeclaro);border:1px solid var(--verdeline);border-radius:14px;padding:14px;margin:6px 0 4px}
.inbox b{color:var(--verde);font-size:20px}
.inbox small,.outbox small{color:var(--mut)}
.outbox{background:var(--naranjaclaro);border:1px solid var(--naranjaline);border-radius:14px;padding:14px;margin:8px 0 4px}
.outbox b:first-child{color:var(--naranja);font-size:20px}
.alert{background:var(--alertbg);border:1px solid var(--rojo);border-radius:14px;padding:12px 14px;margin:8px 0;color:var(--alerttxt)}
.ok{background:var(--verdeclaro);border:1px solid var(--verdeline);border-radius:12px;padding:10px 12px;margin-top:10px;color:var(--oktxt);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{flex:1 1 40%;height:50px;border-radius:12px;background:var(--bg);border:2px solid var(--line);color:var(--txt);font-weight:700;font-size:16px}
.chips button.on{border-color:var(--azul2);background:var(--azulclaro);color:var(--acento)}
table.caja{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}
table.caja td,table.caja th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
table.caja td:first-child,table.caja th:first-child{text-align:left}
table.caja th{color:var(--acento)}
.stats #cext2{flex-wrap:wrap;row-gap:2px}
.stats #cext{display:flex;gap:12px;flex-wrap:wrap}
.stats #cext b{color:#fff}
.stats #cpue{margin-left:auto;white-space:nowrap}
label{display:block;color:var(--txt2);font-size:13px;font-weight:600;margin:12px 0 4px}
.field{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--txt);padding:0 14px;font-size:17px;outline:none}
.field:focus{border-color:var(--azul2)}
select.field{appearance:auto}
.hint{color:var(--mut);font-size:13px;margin-top:6px}
.chk{display:flex;align-items:center;gap:10px;margin-top:12px;color:var(--txt);font-weight:400;font-size:16px}
.chk input{width:22px;height:22px;accent-color:var(--verde)}

/* pantallas completas */
.screen{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:24px 22px calc(24px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto}
.screen h1{font-size:28px;margin:0 0 6px;color:var(--acento)}
.screen p{color:var(--mut);margin:0 0 14px}
.crest{width:110px;height:110px;margin-bottom:14px;object-fit:contain}
.crest.sm{width:80px;height:80px}
.hlogo{width:38px;height:38px;flex:none;object-fit:contain}
.pin{letter-spacing:10px;text-align:center;font-size:28px;height:62px}

/* organizador */
.admin h3{margin:22px 0 6px;font-size:16px;color:var(--acento)}
.box{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px}
.linkbox{word-break:break-all;font-size:13px;color:var(--txt2);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
.prev{font-size:13px;color:var(--txt2);margin-top:10px;max-height:150px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
details summary{color:var(--acento);font-weight:600;cursor:pointer;margin-top:4px}

.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:12px;z-index:40;max-width:90vw;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.demo{background:var(--celeste);color:var(--azul);text-align:center;font-size:12px;padding:4px;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script type="module">
/* =====================================================================
   CONFIGURACIÓN
   ===================================================================== */
// Proyecto Firebase (el mismo de Tiburones y el Kiosko). Si apiKey dice
// PEGAR_AQUI, la app corre en MODO DEMO (datos solo en este navegador).
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDtbHCCFpkuFxdJQBMUMVYKRaTCKDvw5vA",
  authDomain: "kiosco-liceo.firebaseapp.com",
  projectId: "kiosco-liceo",
  storageBucket: "kiosco-liceo.firebasestorage.app",
  messagingSenderId: "650410053332",
  appId: "1:650410053332:web:c61ee15e64d461192c7541"
};
const CONFIG = {
  evento: "Fiesta Matinée Liceo Naval",
  precioPuerta: 20000,
  pinPuerta: "1234",   // lo carga cada persona de la puerta una sola vez
  pinAdmin: "5678",    // para conectar la planilla y crear el link
  syncMinutos: 2       // cada cuánto se revisa la planilla de Drive
};
/* ===================================================================== */

const DEMO = new URLSearchParams(location.search).has("demo") || !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey === "PEGAR_AQUI";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
const fmtTime = ms => ms ? new Date(ms).toLocaleTimeString("es-AR", {hour:"2-digit", minute:"2-digit", hour12:false}) : "";
const money = n => "$" + Number(n || 0).toLocaleString("es-AR");
const LS = {
  get(k, d = null){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
document.documentElement.dataset.theme = LS.get("pm_theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
function hashId(str){ // FNV-1a → id estable: la misma persona nunca se duplica al releer la planilla
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return "f_" + (h >>> 0).toString(36);
}
function randCode(n = 20){
  const a = "abcdefghjkmnpqrstuvwxyz23456789"; const b = new Uint32Array(n);
  crypto.getRandomValues(b); return [...b].map(x => a[x % a.length]).join("");
}
function titleCase(s){
  return String(s ?? "").trim().replace(/\s+/g, " ").toLowerCase()
    .replace(/(^|[\s'-])(\p{L})/gu, (m, p, c) => p + c.toUpperCase());
}

/* ------------------------- estado ------------------------- */
const S = {
  ev: null, device: LS.get("pm_device"), people: new Map(), meta: {},
  online: navigator.onLine, pending: false, tab: "faltan", q: "", limit: 80,
  admin: false, flash: new Set(), ready: false, ocultos: new Set(),
  sync: {at: null, err: null, running: false}
};

(function readEventFromUrl(){
  const u = new URL(location.href); const e = u.searchParams.get("e");
  if (e && /^[a-z0-9]{12,40}$/.test(e)){
    LS.set("pm_event", e); u.searchParams.delete("e");
    history.replaceState(null, "", u.pathname + (u.search || "") + u.hash);
  }
  S.ev = LS.get("pm_event");
})();

/* ------------------------- capa de datos ------------------------- */
let store;
const BASE_FIELDS = ["nombre", "dni", "extra", "fuente"]; // lo único que trae la planilla
const SIN_SALIDA = {salio: false, salioAt: null, salioPor: null, retiradoPor: null};
const SIN_INGRESO = {entro: false, entroAt: null, entroAtLocal: null, entroPor: null, ...SIN_SALIDA};

function makeDemoStore(){
  const key = () => "pm_demo_" + S.ev;
  const bc = "BroadcastChannel" in window ? new BroadcastChannel("pm_demo") : null;
  let cb = null;
  const load = () => LS.get(key(), {meta:{}, people:{}});
  const save = d => { LS.set(key(), d); emit(d); bc && bc.postMessage("x"); };
  const emit = (d = load()) => cb && cb({meta: d.meta, people: Object.values(d.people), pending: false, changed: []});
  bc && (bc.onmessage = () => emit());
  window.addEventListener("storage", e => { if (e.key === key()) emit(); });
  return {
    subscribe(f){ cb = f; emit(); },
    async createEvent(meta){ LS.set(key(), {meta, people:{}}); },
    async saveMeta(m){ const d = load(); d.meta = {...d.meta, ...m}; save(d); },
    async checkIn(id, device){
      const d = load(); const p = d.people[id]; if (!p) throw new Error("No existe");
      if (p.entro) return {already: true, p};
      Object.assign(p, {entro: true, entroAt: Date.now(), entroPor: device}); save(d); return {ok: true};
    },
    async undo(id){ const d = load(); Object.assign(d.people[id], SIN_INGRESO); save(d); },
    async update(id, f){ const d = load(); if (d.people[id]) Object.assign(d.people[id], f); save(d); },
    async add(p){ const d = load(); d.people[p.id] = p; save(d); },
    async addMany(list){ const d = load(); list.forEach(p => { d.people[p.id] = {...(d.people[p.id] || {}), ...pick(p), id: p.id}; }); save(d); },
    async remove(id){ const d = load(); delete d.people[id]; save(d); },
    async resetAll(){
      const d = load();
      for (const [id, p] of Object.entries(d.people)){
        if (p.fuente === "puerta") delete d.people[id];
        else Object.assign(p, SIN_INGRESO);
      }
      save(d);
    }
  };
}
const pick = p => Object.fromEntries(BASE_FIELDS.map(k => [k, p[k] ?? ""]));

async function makeFirebaseStore(){
  const V = "10.12.2", G = `https://www.gstatic.com/firebasejs/${V}/`;
  const [{initializeApp}, {getAuth, signInAnonymously, onAuthStateChanged}, F] = await Promise.all([
    import(G + "firebase-app.js"), import(G + "firebase-auth.js"), import(G + "firebase-firestore.js")
  ]);
  const app = initializeApp(FIREBASE_CONFIG, "puerta");
  const auth = getAuth(app);
  let db;
  try { db = F.initializeFirestore(app, {localCache: F.persistentLocalCache({tabManager: F.persistentMultipleTabManager()})}); }
  catch { db = F.getFirestore(app); }
  await new Promise((res, rej) => {
    const off = onAuthStateChanged(auth, u => { if (u){ off(); res(); } });
    signInAnonymously(auth).catch(e => { if (!navigator.onLine) res(); else rej(e); });
  });
  const evRef = () => F.doc(db, "eventos", S.ev);
  const col = () => F.collection(db, "eventos", S.ev, "asistentes");
  const pRef = id => F.doc(db, "eventos", S.ev, "asistentes", id);
  const toMs = t => t && t.toMillis ? t.toMillis() : (typeof t === "number" ? t : null);
  return {
    subscribe(f){
      let meta = {}, people = [], pend = false, changed = [];
      const send = () => f({meta, people, pending: pend, changed});
      F.onSnapshot(evRef(), s => { meta = s.data() || {}; send(); }, showError);
      F.onSnapshot(col(), {includeMetadataChanges: true}, s => {
        changed = s.docChanges().filter(c => c.type === "modified" && !c.doc.metadata.hasPendingWrites).map(c => c.doc.id);
        people = s.docs.map(d => { const x = d.data(); return {...x, id: d.id, entroAt: toMs(x.entroAt) || x.entroAtLocal || null}; });
        pend = s.metadata.hasPendingWrites; send();
      }, showError);
    },
    async createEvent(meta){ await F.setDoc(evRef(), {...meta, creado: F.serverTimestamp()}); },
    async saveMeta(m){ await F.setDoc(evRef(), m, {merge: true}); },
    async checkIn(id, device){
      const data = {entro: true, entroAt: F.serverTimestamp(), entroAtLocal: Date.now(), entroPor: device};
      if (navigator.onLine){
        try {
          return await F.runTransaction(db, async tx => {
            const s = await tx.get(pRef(id));
            if (!s.exists()) throw new Error("No existe");
            const x = s.data();
            if (x.entro) return {already: true, p: {...x, entroAt: toMs(x.entroAt) || x.entroAtLocal}};
            tx.update(pRef(id), data); return {ok: true};
          });
        } catch (e) { if (e.message === "No existe") throw e; }
      }
      F.updateDoc(pRef(id), data).catch(showError); // queda en cola hasta que vuelva la señal
      return {ok: true, queued: true};
    },
    async undo(id){ F.updateDoc(pRef(id), SIN_INGRESO).catch(showError); },
    async update(id, f){ F.updateDoc(pRef(id), f).catch(showError); },
    async add(p){ const {id, ...rest} = p; F.setDoc(pRef(id), {...rest, entroAt: rest.entro ? F.serverTimestamp() : null}).catch(showError); },
    async addMany(list){ // merge de los datos de la planilla: nunca pisa quién entró
      for (let i = 0; i < list.length; i += 450){
        const b = F.writeBatch(db);
        list.slice(i, i + 450).forEach(p => b.set(pRef(p.id), pick(p), {merge: true}));
        await b.commit();
      }
    },
    async remove(id){ F.deleteDoc(pRef(id)).catch(showError); },
    async resetAll(){ // destilda todos los ingresos y borra las ventas en puerta
      const snap = await F.getDocs(col());
      const ops = snap.docs.filter(d => d.data().fuente === "puerta" || d.data().entro || d.data().salio);
      for (let i = 0; i < ops.length; i += 450){
        const b = F.writeBatch(db);
        ops.slice(i, i + 450).forEach(d => d.data().fuente === "puerta" ? b.delete(d.ref)
          : b.update(d.ref, SIN_INGRESO));
        await b.commit();
      }
      return ops.length;
    }
  };
}

function showError(e){
  console.error(e);
  const m = String(e && (e.code || e.message) || e);
  if (/permission/i.test(m)) toast("Sin permiso en la base. Revisá las reglas de Firestore.");
  else if (/admin-restricted|operation-not-allowed/i.test(m)) toast("Activá 'Anónimo' en Firebase → Authentication.");
  else toast("Error: " + m);
}

/* ------------------------- planilla de Drive ------------------------- */
// Acepta el link de una Hoja de cálculo de Google (compartida "Cualquiera con el enlace")
// o la URL de un Apps Script que devuelva CSV (opción privada, ver LEEME).
function sourceUrls(url){
  url = String(url || "").trim();
  if (/script\.google(usercontent)?\.com\//.test(url)) return {urls: [url]};
  const m = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  if (m){
    const gid = (url.match(/[#&?]gid=(\d+)/) || [])[1] || "0";
    return {urls: [
      `https://docs.google.com/spreadsheets/d/${m[1]}/export?format=csv&gid=${gid}`,
      `https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv&gid=${gid}`
    ]};
  }
  if (/drive\.google\.com\/(file|open)/.test(url))
    return {error: "Ese link es de un archivo (Excel) subido a Drive. Abrilo y hacé Archivo → Guardar como Hojas de cálculo de Google, y pegá el link de esa hoja."};
  return {error: "No reconozco el link. Tiene que ser de una Hoja de cálculo de Google (docs.google.com/spreadsheets/…)."};
}
async function fetchSheet(url){
  const src = sourceUrls(url); if (src.error) throw new Error(src.error);
  if (!window.XLSX) throw new Error("No cargó el lector de planillas. Revisá la conexión.");
  let lastErr;
  for (const u of src.urls){
    try {
      const r = await fetch(u, {cache: "no-store", redirect: "follow"});
      const text = await r.text();
      if (!r.ok || /^\s*</.test(text)) { lastErr = new Error("PRIVADA"); continue; }
      const wb = XLSX.read(text, {type: "string", raw: true});
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1, defval: "", raw: false, blankrows: false});
      if (!rows.length) throw new Error("La planilla está vacía.");
      return {headers: rows[0].map(h => String(h).trim()), data: rows.slice(1)};
    } catch (e){ lastErr = e; }
  }
  if (lastErr && (lastErr.message === "PRIVADA" || /fetch|network|cors/i.test(lastErr.message)))
    throw new Error("No pude leer la planilla. En Drive: Compartir → Acceso general → \"Cualquier persona con el enlace\" → Lector.");
  throw lastErr || new Error("No pude leer la planilla.");
}

const GUESS = {
  nombre: /^(nombre(s)?( y apellido)?|nombre completo|apellido y nombre|name|full name)/i,
  apellido: /^(apellido(s)?|last ?name|surname)$/i,
  dni: /(dni|documento|n[uú]mero de doc)/i,
  extra: /(invitad|curso|categor|divisi|colegio|escuela)/i
};
function guessMap(headers){
  const used = []; const find = rx => { const i = headers.findIndex((h, j) => !used.includes(j) && rx.test(String(h).trim())); if (i >= 0) used.push(i); return i; };
  const n = find(GUESS.nombre), a = find(GUESS.apellido), d = find(GUESS.dni), x = find(GUESS.extra);
  return {nombre: headers[n] || "", apellido: headers[a] || "", dni: headers[d] || "", extra: headers[x] || ""};
}
// "Santa cruz Bautista" y "Bautista Santa Cruz" son la misma persona
function claveNombre(nombre, dni){ return norm(nombre).split(" ").sort().join(" ") + "|" + (dni || ""); }
function esNuevo(p){
  if (S.people.has(p.id) || S.ocultos.has(p.id)) return false;   // borrados a mano no vuelven
  const k = claveNombre(p.nombre, p.dni);
  for (const x of S.people.values()) if (claveNombre(x.nombre, x.dni) === k) return false;
  return true;
}
function rowsToPeople(headers, data, map){
  const ix = k => map[k] ? headers.indexOf(map[k]) : -1;
  const iN = ix("nombre"), iA = ix("apellido"), iD = ix("dni"), iE = ix("extra");
  if (iN < 0) return {list: [], dup: 0, skip: 0, missing: map.nombre};
  const seen = new Map(); let dup = 0, skip = 0;
  for (const r of data){
    const nombre = titleCase([r[iN], iA >= 0 ? r[iA] : ""].join(" "));
    if (!nombre){ skip++; continue; }
    const dni = iD >= 0 ? String(r[iD]).replace(/\D/g, "") : "";
    const extra = iE >= 0 ? String(r[iE]).trim().slice(0, 60) : "";
    const id = hashId(norm(nombre) + "|" + dni);
    const k = claveNombre(nombre, dni);   // mismo nombre aunque esté en otro orden
    if (seen.has(k)){ dup++; continue; }
    seen.set(k, {id, nombre, dni, extra, fuente: "form"});
  }
  return {list: [...seen.values()], dup, skip};
}

// Revisa la planilla y agrega a los nuevos. Corre sola cada pocos minutos en todos los celulares.
async function syncDrive({manual = false} = {}){
  const url = S.meta.fuenteUrl, map = S.meta.mapa;
  if (!url || !map || S.sync.running || (!manual && !navigator.onLine)) return;
  S.sync.running = true; drawHeader();
  try {
    const {headers, data} = await fetchSheet(url);
    const {list, missing} = rowsToPeople(headers, data, map);
    if (missing) throw new Error(`La planilla ya no tiene la columna "${missing}". Volvé a elegir columnas en ⚙️.`);
    const nuevos = list.filter(esNuevo);
    if (nuevos.length) await store.addMany(nuevos);
    S.sync.at = Date.now(); S.sync.err = null;
    if (manual) toast(nuevos.length ? `✔ ${nuevos.length} nuevos desde Drive` : "✔ Lista al día, no hay nuevos");
    else if (nuevos.length) toast(`Drive: ${nuevos.length} nuevo${nuevos.length > 1 ? "s" : ""} en la lista`);
    return nuevos.length;
  } catch (e){
    S.sync.err = e.message; if (manual) toast(e.message, 5000);
    throw e;
  } finally { S.sync.running = false; drawHeader(); }
}

// estado de cada persona: falta → adentro → se fue
const estado = p => p.salio ? "fue" : p.entro ? "adentro" : "falta";

function filtered(){
  const q = norm(S.q); const toks = q ? q.split(" ") : [];
  let list = [...S.people.values()];
  if (toks.length) list = list.filter(p => { const h = p._s || (p._s = norm(`${p.nombre} ${p.dni || ""} ${p.extra || ""}`)); return toks.every(t => h.includes(t)); });
  // buscando, en "Faltan" también aparecen los que ya entraron (para avisar)
  if (!toks.length || S.tab !== "faltan"){
    if (S.tab === "faltan") list = list.filter(p => estado(p) === "falta");
    if (S.tab === "adentro") list = list.filter(p => estado(p) === "adentro");
    if (S.tab === "fueron") list = list.filter(p => estado(p) === "fue");
  }
  if (S.tab === "adentro") list.sort((a, b) => (b.entroAt || 0) - (a.entroAt || 0));
  else if (S.tab === "fueron") list.sort((a, b) => (b.salioAt || 0) - (a.salioAt || 0));
  else list.sort((a, b) => (a._k || (a._k = norm(a.nombre))).localeCompare(b._k || (b._k = norm(b.nombre))));
  return list;
}

        fuente: "puerta", monto: Number($("#m", el).value.replace(/\D/g, "")) || 0, pago, vendidoPor: S.device, vendidoAt: Date.now(),
        entro, entroAt: entro ? Date.now() : null, entroAtLocal: entro ? Date.now() : null, entroPor: entro ? S.device : null, ...SIN_SALIDA};
      await store.add(p); buzz(40); closeSheet(); toast(`✔ ${nombre} agregado${entro ? " y adentro" : ""} · ${pago}`);
      clearSearch();
    };
  });
}

// caja de puerta: totales por forma de pago y por quién cobró
function cajaHtml(){
  const pue = [...S.people.values()].filter(p => p.fuente === "puerta");
  if (!pue.length) return `<div class="hint" style="margin-top:0">Todavía no hubo ventas en puerta.</div>`;
  const sum = arr => arr.reduce((s, p) => s + (p.monto || 0), 0);
  const by = k => { const m = {}; pue.forEach(p => { const v = p[k] || "Sin dato"; (m[v] = m[v] || []).push(p); }); return m; };
  const filas = m => Object.entries(m).map(([k, a]) => `<tr><td>${esc(k)}</td><td>${a.length}</td><td>${money(sum(a))}</td></tr>`).join("");
  return `<table class="caja">
      <tr><th>Total</th><th>${pue.length}</th><th>${money(sum(pue))}</th></tr>
      ${filas(by("pago"))}
    </table>
    <div class="hint">Por quién cobró:</div>
    <table class="caja">${filas(by("vendidoPor"))}</table>`;
}

function askPin(title, expected, ok){
  sheet(`<h2>${esc(title)}</h2>
    <input class="field pin" id="p" inputmode="numeric" type="password" autocomplete="off" maxlength="8" style="margin-top:12px">
    <button class="btn or" id="ok">Continuar</button><button class="btn ghost" id="x">Cancelar</button>`, el => {
    const go = () => { if ($("#p", el).value.trim() === expected){ closeSheet(); ok(); } else { buzz([80,60,80]); toast("PIN incorrecto"); $("#p", el).value = ""; } };
    $("#ok", el).onclick = go; $("#x", el).onclick = closeSheet; $("#p", el).onkeydown = e => { if (e.key === "Enter") go(); };
    setTimeout(() => $("#p", el).focus(), 50);
  });
}

/* ------------------------- organizador ------------------------- */
function shareLink(){ return location.origin + location.pathname + "?e=" + S.ev; }

function openAdmin(){
  const all = [...S.people.values()], m = S.meta;
  sheet(`<div class="admin">
    <h2>Organizador</h2>
    <div class="meta">${all.length} en la lista · ${all.filter(p => p.entro).length} adentro</div>

    <h3>1. Lista desde Drive</h3>
    <div class="box" id="drive">
      ${m.fuenteUrl ? `
        <div class="ok">✔ Conectada. Se revisa sola cada ${CONFIG.syncMinutos} min y agrega a los nuevos.<br>
        Columnas: ${esc([m.mapa?.nombre, m.mapa?.apellido, m.mapa?.dni, m.mapa?.extra].filter(Boolean).join(", "))}</div>
        ${S.sync.err ? `<div class="alert">${esc(S.sync.err)}</div>` : ""}
        <div class="linkbox">${esc(m.fuenteUrl)}</div>
        <button class="btn or sm" id="syncnow">Actualizar ahora</button>
        <button class="btn sm" id="change">Cambiar planilla o columnas</button>`
      : driveFormHtml()}
    </div>

    <h3>2. Pasar el link al equipo de puerta</h3>
    <div class="box">
      <div class="hint" style="margin-top:0">Mandalo por WhatsApp solo al equipo de puerta, junto con el PIN de puerta. Cada uno lo abre y lo agrega a la pantalla de inicio.</div>
      <div class="linkbox">${esc(shareLink())}</div>
      <button class="btn or sm" id="share">Compartir link</button>
    </div>

    <h3>3. Evento</h3>
    <div class="box">
      <label style="margin-top:0">Nombre</label><input class="field" id="evn" value="${esc(m.nombre || CONFIG.evento)}">
      <label>Precio en puerta</label><input class="field" id="evp" inputmode="numeric" value="${m.precioPuerta ?? CONFIG.precioPuerta}">
      <button class="btn sm" id="savem">Guardar</button>
    </div>

    <h3>Caja de puerta</h3>
    <div class="box">${cajaHtml()}</div>

    <h3>Al final de la noche</h3>
    <button class="btn sm" id="exp">Descargar planilla de asistencia (CSV)</button>

    <h3>Reiniciar noche</h3>
    <div class="box">
      <div class="hint" style="margin-top:0">Deja a todos como <b>"Falta"</b> y borra las ventas en puerta. Usalo después de las pruebas, antes de abrir la puerta. La lista del Excel no se toca.</div>
      <button class="btn warn sm" id="reset">Reiniciar noche</button>
    </div>

    <details style="margin-top:18px"><summary>¿Sin Drive? Importar un archivo Excel/CSV</summary>
      <div class="box" style="margin-top:8px">
        <input type="file" id="file" accept=".csv,.xlsx,.xls,.ods,text/csv" class="field" style="padding:10px;height:auto">
        <div id="fmap"></div>
      </div>
    </details>
    <button class="btn ghost" id="dev">Cambiar nombre de este celular</button>
    <button class="btn ghost" id="x">Cerrar</button>
  </div>`, el => {
    $("#x", el).onclick = closeSheet;
    wireDriveForm(el);
    const sn = $("#syncnow", el); if (sn) sn.onclick = async () => { sn.disabled = true; sn.textContent = "Leyendo planilla…"; try { await syncDrive({manual: true}); closeSheet(); } catch { sn.disabled = false; sn.textContent = "Actualizar ahora"; } };
    const ch = $("#change", el); if (ch) ch.onclick = () => { $("#drive", el).innerHTML = driveFormHtml(m.fuenteUrl); wireDriveForm(el); };
    $("#file", el).onchange = e => e.target.files[0] && importFile(e.target.files[0], $("#fmap", el));
    $("#share", el).onclick = async () => {
      const text = `Control de entrada – ${S.meta.nombre || CONFIG.evento}\n${shareLink()}`;
      try { if (navigator.share){ await navigator.share({text}); return; } } catch { return; }
      try { await navigator.clipboard.writeText(shareLink()); toast("Link copiado"); } catch { toast("Copialo a mano del recuadro"); }
    };
    $("#savem", el).onclick = async () => {
      await store.saveMeta({nombre: $("#evn", el).value.trim() || CONFIG.evento, precioPuerta: Number($("#evp", el).value.replace(/\D/g, "")) || 0});
      toast("Guardado");
    };
    $("#exp", el).onclick = exportCsv;
    const rs = $("#reset", el);
    rs.onclick = async () => {
      const inn = [...S.people.values()].filter(p => p.entro).length, pue = [...S.people.values()].filter(p => p.fuente === "puerta").length;
      if (!rs.dataset.c){ rs.dataset.c = 1; rs.textContent = `Confirmar: destildar ${inn} y borrar ${pue} de puerta`; rs.style.background = "var(--rojo)"; rs.style.color = "#fff"; return; }
      rs.disabled = true; rs.textContent = "Reiniciando…";
      try { await store.resetAll(); toast("✔ Noche reiniciada: todos en \"Falta\""); closeSheet(); }
      catch (e){ showError(e); rs.disabled = false; rs.textContent = "Reiniciar noche"; }
    };
    $("#dev", el).onclick = () => { LS.del("pm_device"); S.device = null; closeSheet(); render(); };
  });
}

function driveFormHtml(val = ""){
  return `<div class="hint" style="margin-top:0">Pegá la dirección del <b>lector</b> (script.google.com/macros/…) o el link de una Hoja de cálculo de Google compartida como "Cualquier persona con el enlace".</div>
    <input class="field" id="surl" placeholder="https://script.google.com/macros/s/…" value="${esc(val)}" style="margin-top:10px" autocomplete="off">
    <button class="btn or sm" id="sread">Leer planilla</button>
    <div id="smap"></div>`;
}
function wireDriveForm(el){
  const b = $("#sread", el); if (!b) return;
  b.onclick = async () => {
    const url = $("#surl", el).value.trim(); if (!url){ toast("Pegá el link de la planilla"); return; }
    b.disabled = true; b.textContent = "Leyendo…"; $("#smap", el).innerHTML = "";
    try {
      const {headers, data} = await fetchSheet(url);
      mappingUI($("#smap", el), headers, data, S.meta.mapa, "Conectar y cargar", async (map, nuevos) => {
        S.sync.at = Date.now(); S.sync.err = null;
        await store.saveMeta({fuenteUrl: url, mapa: map});
        if (nuevos.length) await store.addMany(nuevos);
        toast(`✔ Planilla conectada · ${nuevos.length} personas cargadas`); closeSheet();
      });
    } catch (e){ $("#smap", el).innerHTML = `<div class="alert">${esc(e.message)}</div>`; }
    b.disabled = false; b.textContent = "Leer planilla";
  };
}

// Pantalla para elegir qué columna es cada cosa. Solo se suben esas columnas.
function mappingUI(box, headers, data, prevMap, label, onOk){
  const g = prevMap && headers.includes(prevMap.nombre) ? prevMap : guessMap(headers);
  const opts = sel => `<option value="">— ninguna —</option>` + headers.map((h, i) => h ? `<option ${h === sel ? "selected" : ""}>${esc(h)}</option>` : "").join("");
  box.innerHTML = `
    <div class="hint">${data.length} filas. Elegí qué columna es cada cosa (solo se sube eso; teléfonos, mails y comprobantes quedan en la planilla):</div>
    <label>Nombre (o nombre y apellido)</label><select class="field" data-k="nombre">${opts(g.nombre)}</select>
    <label>Apellido (si viene aparte)</label><select class="field" data-k="apellido">${opts(g.apellido)}</select>
    <label>DNI</label><select class="field" data-k="dni">${opts(g.dni)}</select>
    <label>Dato extra para mostrar (ej. invitado de, curso)</label><select class="field" data-k="extra">${opts(g.extra)}</select>
    <div class="prev" id="pv"></div>
    <button class="btn go" id="imp" style="height:58px;font-size:18px">${label}</button>`;
  const readMap = () => Object.fromEntries([...box.querySelectorAll("select")].map(s => [s.dataset.k, s.value]));
  const preview = () => {
    const {list, dup, skip} = rowsToPeople(headers, data, readMap());
    const nuevos = list.filter(esNuevo);
    $("#pv", box).innerHTML = list.length
      ? `<b>${nuevos.length} nuevos</b> · ${list.length - nuevos.length} ya estaban${dup ? ` · ${dup} repetidos (se cargan una vez)` : ""}${skip ? ` · ${skip} filas sin nombre` : ""}<br><br>` +
        list.slice(0, 6).map(p => esc(p.nombre) + (p.dni ? " · " + esc(p.dni) : "") + (p.extra ? " · " + esc(p.extra) : "")).join("<br>") + (list.length > 6 ? "<br>…" : "")
      : "Elegí la columna del nombre.";
    $("#imp", box).disabled = !list.length;
    return nuevos;
  };
  box.querySelectorAll("select").forEach(s => s.onchange = preview);
  preview();
  $("#imp", box).onclick = async () => {
    const nuevos = preview(); const btn = $("#imp", box);
    btn.disabled = true; btn.textContent = "Subiendo…";
    try { await onOk(readMap(), nuevos); } catch (e){ showError(e); btn.disabled = false; btn.textContent = label; }
  };
}

async function importFile(file, box){
  if (!window.XLSX){ box.innerHTML = `<div class="alert">No cargó el lector de planillas. Revisá la conexión.</div>`; return; }
  try {
    const wb = XLSX.read(await file.arrayBuffer(), {type: "array", raw: false, codepage: 65001});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1, defval: "", raw: false, blankrows: false});
    if (rows.length < 2){ box.innerHTML = `<div class="alert">El archivo está vacío.</div>`; return; }
    mappingUI(box, rows[0].map(h => String(h).trim()), rows.slice(1), null, "Importar", async (map, nuevos) => {
      if (nuevos.length) await store.addMany(nuevos);
      toast(`✔ ${nuevos.length} personas importadas`); closeSheet();
    });
  } catch (e){ box.innerHTML = `<div class="alert">No pude leer el archivo: ${esc(e.message)}</div>`; }
}

function exportCsv(){
  const dni = hasDni();
  const rows = [["Nombre", ...(dni ? ["DNI"] : []), "Invitado por", "Origen", "Monto puerta", "Forma de pago", "Cobró", "Entró", "Hora ingreso", "Marcó ingreso", "Se fue", "Hora salida", "Lo retiró", "Marcó salida"]];
  [...S.people.values()].sort((a, b) => norm(a.nombre).localeCompare(norm(b.nombre))).forEach(p =>
    rows.push([p.nombre, ...(dni ? [p.dni || ""] : []), p.extra || "", p.fuente === "puerta" ? "Puerta" : "Planilla", p.monto || "", p.pago || "", p.vendidoPor || "",
      p.entro ? "Sí" : "No", fmtTime(p.entroAt), p.entroPor || "", p.salio ? "Sí" : "No", fmtTime(p.salioAt), p.retiradoPor || "", p.salioPor || ""]));
  const csv = "﻿" + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv;charset=utf-8"}));
  a.download = "asistencia-" + new Date().toISOString().slice(0, 10) + ".csv"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ------------------------- arranque ------------------------- */
let booted = false, syncTimer = null;
async function boot(creating = false){
  if (!store){
    try { store = DEMO ? makeDemoStore() : await makeFirebaseStore(); }
    catch (e){ showError(e); $("#app").innerHTML = `<div class="screen"><div class="crest">⚠️</div><h1>No pude conectar</h1><p>Revisá la conexión y volvé a abrir la app.</p></div>`; return; }
  }
  if (creating) await store.createEvent({nombre: CONFIG.evento, precioPuerta: CONFIG.precioPuerta});
  if (booted) return; booted = true;
  store.subscribe(({meta, people, pending, changed}) => {
    const hadUrl = S.meta.fuenteUrl;
    S.meta = meta || {}; S.pending = pending;
    S.ocultos = new Set(people.filter(p => p.oculto).map(p => p.id));
    const prev = S.people; S.people = new Map(people.filter(p => !p.oculto).map(p => [p.id, p]));
    if (S.ready) changed.forEach(id => { const a = prev.get(id), b = S.people.get(id); if (b && b.entro && !(a && a.entro)) S.flash.add(id); });
    const first = !S.ready; S.ready = true;
    if (first || !$("#main")) render(); else { drawHeader(); if (!document.querySelector(".sheet")) drawList(); else S.flash.clear(); }
    if (S.meta.fuenteUrl && (!hadUrl || first)) startAutoSync();
  });
}
function startAutoSync(){
  clearInterval(syncTimer);
  const tick = () => { if (document.visibilityState === "visible") syncDrive().catch(() => {}); };
  setTimeout(tick, 1500 + Math.random() * 3000);            // al abrir
  syncTimer = setInterval(tick, CONFIG.syncMinutos * 60000 + Math.random() * 20000);
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && S.meta.fuenteUrl && (!S.sync.at || Date.now() - S.sync.at > 60000)) syncDrive().catch(() => {});
});
// pantalla siempre encendida mientras la app está abierta
let wakeLock = null;
async function keepAwake(){
  try { if ("wakeLock" in navigator && document.visibilityState === "visible" && !wakeLock){
    wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; });
  } } catch {}
}
document.addEventListener("visibilitychange", keepAwake);
document.addEventListener("click", keepAwake, {once: true});
keepAwake();

// modo oscuro: por defecto sigue al celular; el botón lo fija en este dispositivo
function applyTheme(){
  const t = LS.get("pm_theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name="theme-color"]').content = t === "dark" ? "#0a1a45" : "#003087";
  const b = $("#theme"); if (b) b.textContent = t === "dark" ? "☀️" : "🌙";
}
function toggleTheme(){ LS.set("pm_theme", document.documentElement.dataset.theme === "dark" ? "light" : "dark"); applyTheme(); }
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme); } catch {}

window.addEventListener("online", () => { S.online = true; drawHeader(); });
window.addEventListener("offline", () => { S.online = false; drawHeader(); });
new MutationObserver(() => { if (!$("#layer").children.length) drawList(); }).observe($("#layer"), {childList: true});

if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
render();
if (S.ev) boot();
</script>
